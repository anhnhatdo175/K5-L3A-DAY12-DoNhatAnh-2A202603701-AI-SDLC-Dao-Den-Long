<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root { --ui: 1; --sky:#0E1430; --fog:#1B2350; --gold:#F2C14E; --danger:#FF5A5F; --text:#F5F1E6; --lamp:#FFB347; }
  body.cb-mode { --danger: #FFFFFF; }
  body.big { --ui: 1.25; }
  body.rm #clock.low { animation: none; }
  html, body { margin: 0; height: 100%; background: var(--sky); overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  .box { position: absolute; padding: 8px 14px; background: rgba(14, 20, 48, .6); border: 1px solid rgba(242, 193, 78, .45); border-radius: 12px; font-size: calc(18px * var(--ui)); }
  #flames { top: 14px; left: 14px; font-size: calc(24px * var(--ui)); letter-spacing: 3px; }
  #clock { top: 14px; left: 50%; transform: translateX(-50%); font-size: calc(28px * var(--ui)); font-weight: 700; font-variant-numeric: tabular-nums; }
  #clock.low { color: var(--danger); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #right { top: 14px; right: 14px; text-align: right; }
  #right b { color: var(--gold); }
  #motes { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 8px 12px; }
  #motes i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 229, 138, .5); background: rgba(14,20,48,.5); }
  #motes i.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 100%); box-shadow: 0 0 8px #FFE58A; border-color: #FFE58A; }
  #cds { bottom: 18px; right: 14px; display: flex; gap: 10px; }
  .cd { position: relative; min-width: calc(86px * var(--ui)); height: calc(60px * var(--ui)); padding: 0 6px; box-sizing: border-box; border-radius: 12px; border: 2px solid var(--gold); background: rgba(14,20,48,.7); display: flex; align-items: center; justify-content: center; font-size: calc(18px * var(--ui)); text-align: center; line-height: 1.1; overflow: hidden; }
  .cd .fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,90,95,.55); height: 0; }
  .cd span { position: relative; }
  .cd.ready { box-shadow: 0 0 10px var(--lamp); }
  #hint { bottom: 82px; left: 50%; transform: translateX(-50%); display: none; font-size: calc(20px * var(--ui)); border-color: var(--lamp); }
  #keys { bottom: 18px; left: 14px; max-width: 400px; font-size: calc(18px * var(--ui)); opacity: .9; line-height: 1.35; }
  #toast { position: absolute; top: 78px; width: 100%; text-align: center; font-size: calc(22px * var(--ui)); opacity: 0; transition: opacity .4s; text-shadow: 0 2px 6px #000; }
  #wind { position: absolute; top: 120px; width: 100%; text-align: center; font-size: calc(20px * var(--ui)); color: #8FA3B8; display: none; text-shadow: 0 2px 6px #000; }
  #arrow { position: absolute; width: 0; height: 0; display: none; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 34px solid var(--lamp); filter: drop-shadow(0 0 6px #000); }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(14, 20, 48, .78); text-align: center; padding: 20px; box-sizing: border-box; }
  #screen h1 { font-size: calc(48px * var(--ui)); margin: 0 0 8px; color: var(--gold); }
  #screen h2 { font-size: calc(30px * var(--ui)); margin: 0 0 8px; color: var(--gold); }
  #screen p { font-size: calc(20px * var(--ui)); margin: 6px; max-width: 640px; line-height: 1.45; }
  #screen .elder { font-style: italic; color: #FFE9B0; }
  button { font: inherit; font-size: calc(20px * var(--ui)); margin: 8px; padding: 10px 28px; border-radius: 12px; border: 0; background: var(--lamp); color: #2b1536; cursor: pointer; min-width: 220px; }
  button.alt { background: transparent; color: var(--text); border: 2px solid var(--gold); }
  button:hover { filter: brightness(1.1); }
  label { display: block; font-size: calc(18px * var(--ui)); margin: 10px; }
  #screen { overflow-y: auto; }
  #screen h3 { font-size: calc(22px * var(--ui)); margin: 0 0 6px; color: var(--gold); }
  .cols { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; text-align: left; }
  .krow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: calc(18px * var(--ui)); }
  .kbtn { min-width: 120px; margin: 3px; padding: 4px 12px; font-size: calc(18px * var(--ui)); }
  input[type=text] { font: inherit; font-size: calc(20px * var(--ui)); padding: 6px 10px; border-radius: 8px; border: 2px solid var(--gold); background: rgba(14,20,48,.8); color: var(--text); width: 12em; user-select: text; }
  table.lb { border-collapse: collapse; font-size: calc(18px * var(--ui)); margin: 8px; }
  table.lb th, table.lb td { padding: 4px 14px; text-align: left; border-bottom: 1px solid rgba(242,193,78,.3); }
  table.lb tr.me { background: rgba(242,193,78,.25); font-weight: 700; }
  #caps { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(90vw, 760px); }
  .cap { background: rgba(0,0,0,.72); color: #fff; padding: 6px 16px; border-radius: 8px; font-size: calc(20px * var(--ui)); border-left: 5px solid var(--danger); }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; }
  .sarrow { position: absolute; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 36px solid var(--danger); filter: drop-shadow(0 0 4px #000); }
  input[type=range] { width: 240px; vertical-align: middle; }
</style>
</head>
<body>
<div id="hud">
  <div class="box" id="flames"></div>
  <div class="box" id="clock">5:00</div>
  <div class="box" id="right">Đêm <b id="night">1</b> · Đèn <b id="lit">0</b>/<b id="nl">5</b><br>Điểm <b id="score">0</b></div>
  <div class="box" id="motes"></div>
  <div class="box" id="cds"><div class="cd" id="cdDash"><div class="fill"></div><span>Lướt<br>Shift</span></div><div class="cd" id="cdPulse"><div class="fill"></div><span>Tỏa Sáng<br>F</span></div></div>
  <div class="box" id="hint"></div>
  <div class="box" id="keys">WASD đi · Chuột kéo/←→ xoay · Space nhảy · Shift lướt<br>E nạp đèn · F tỏa sáng · Esc/P tạm dừng</div>
  <div id="toast"></div>
  <div id="caps" aria-live="polite"></div>
  <div id="wind">🍃 Gió sắp nổi — bám chắc!</div>
  <div id="arrow"></div>
</div>
<div id="flash"></div>
<div id="screen"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
